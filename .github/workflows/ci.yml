name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run pytest -q -W ignore::DeprecationWarning

  exe:
    # el .exe se compila al etiquetar una versión (git tag v0.1.0) o a mano
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run python scripts/hacer_icono.py
      - run: uv run pyinstaller --noconfirm --clean plasmo.spec
      - run: Compress-Archive -Path dist/Plasmo -DestinationPath dist/Plasmo-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Plasmo-windows
          path: dist/Plasmo-windows.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Plasmo-windows.zip
