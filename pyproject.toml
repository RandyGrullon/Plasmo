[project]
name = "plasmo"
version = "0.1.2"
description = "Sube una imagen y recibe un modelo 3D listo para imprimir. 100% local: Ollama + ComfyUI/Hunyuan3D."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Randy Grullón" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=12",
    "numpy>=1.26",
    "pillow>=10.4",
    "trimesh>=4.4",
    "manifold3d>=2.5",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "rtree>=1.3",
    "onnxruntime>=1.19",
    "pywebview>=5.2",
    "fast-simplification>=0.2.0",
]

[project.scripts]
plasmo = "plasmo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.10",
    "lxml>=6.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plasmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
